<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<title>Calabozo por gestos</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background: #000;
    overflow: hidden;
  }
  .split {
    display: flex;
    width: 100vw;
    height: 100vh;
  }
  .pane {
    flex: 1;
    position: relative;
    overflow: hidden;
    background: #000;
  }
  #video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transform: scaleX(-1);
  }
  #memeImg {
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: #000;
  }
  #debugHud {
    position: absolute;
    top: 8px;
    left: 8px;
    color: #7cffa0;
    font: 13px/1.4 monospace;
    white-space: pre;
    text-shadow: 0 0 3px #000, 0 0 3px #000, 0 0 3px #000;
    pointer-events: none;
    z-index: 2;
  }
  #memeLabel {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 24px;
    text-align: center;
    color: #e8d9a8;
    font: 600 22px/1.3 Georgia, "Times New Roman", serif;
    letter-spacing: 0.04em;
    text-shadow: 0 0 6px #000, 0 0 6px #000, 0 0 10px #000;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div class="split">
    <div class="pane">
      <video id="video" autoplay playsinline muted></video>
      <div id="debugHud"></div>
    </div>
    <div class="pane">
      <img id="memeImg" src="memes/main_room.jpg" alt="" />
      <div id="memeLabel"></div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
